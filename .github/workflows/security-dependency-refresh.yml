name: Security dependency refresh (Windows)

on:
  push:
    branches:
      - fix/dependency-audit-2026-11
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: windows-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve updated dependencies and regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit the generated package-lock.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Regenerate lockfile for security upgrades"
            if ($LASTEXITCODE -ne 0) { throw "Unable to create lockfile commit" }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "Unable to push regenerated lockfile" }
          } else {
            Write-Host "The lockfile is already up to date."
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Electron JavaScript syntax
        run: npm run check

      - name: Run regression tests
        run: npm test

      - name: Compile React frontend
        run: npx vite build

      - name: Security audit (no high or critical findings allowed)
        run: npm audit --audit-level=high

      - name: Package Windows x64 installer and portable EXE
        run: npx electron-builder --win --x64 --publish never

      - name: Verify packaging outputs
        shell: pwsh
        run: |
          if (!(Test-Path 'release/NeverDrop-SPaDe-Setup.exe')) { throw 'Missing setup EXE' }
          if (!(Test-Path 'release/NeverDrop-SPaDe-Portable.exe')) { throw 'Missing portable EXE' }
          Get-ChildItem release/*.exe | Select-Object Name,Length

      - name: Upload Windows installers for testing (not public release)
        uses: actions/upload-artifact@v4
        with:
          name: neverdrop-security-upgrade-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
